<!-- 居宅介護支援事業所 新規登録・編集モーダル（共通） -->
<div class="modal fade" id="renewalOfficeModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered" style="max-width:700px;">
        <div class="modal-content">
            <input type="hidden" id="renewal_modal_pk" value="{% if user.profile.home_care_office %}{{ user.profile.home_care_office.pk }}{% endif %}">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-hospital me-2"></i>居宅介護支援事業所 新規登録・編集</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="renewalOfficeModalError" class="alert alert-danger d-none"></div>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">会社名</label>
                        <input type="text" id="renewal_modal_company_name" class="form-control" value="{{ initial.office_company_name }}" placeholder="例: 株式会社 アールビーサポート">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">事業所名 <span class="text-danger">*</span></label>
                        <input type="text" id="renewal_modal_name" class="form-control" value="{{ initial.office_name }}" placeholder="例: 居宅介護支援事業所 安濃津ろまん" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">フリガナ</label>
                        <input type="text" id="renewal_modal_furigana" class="form-control" value="{{ initial.office_furigana }}" placeholder="例: キョタクカイゴシエンジギョウショ">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">事業所番号 <span class="text-danger">*</span></label>
                        <input type="text" id="renewal_modal_office_number" class="form-control" value="{{ initial.office_number }}" placeholder="例: 2470100419" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">管理者名</label>
                        <input type="text" id="renewal_modal_manager_name" class="form-control" value="{{ initial.office_manager_name }}" placeholder="例: 山田 太郎">
                    </div>
                    <div class="col-12">
                        <label class="form-label">担当者名</label>
                        <div id="renewal_modal_staff_container" class="row g-2 mb-1"></div>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addRenewalModalStaffRow()">
                            <i class="fas fa-plus me-1"></i>担当者を追加
                        </button>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">郵便番号</label>
                        <div class="input-group">
                            <span class="input-group-text">〒</span>
                            <input type="text" id="renewal_modal_postal_code" class="form-control" value="{{ initial.office_postal_code }}" placeholder="000-0000">
                        </div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">住所</label>
                        <input type="text" id="renewal_modal_address" class="form-control" value="{{ initial.office_address }}" placeholder="例: 三重県津市羽所町○○">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">電話番号</label>
                        <input type="text" id="renewal_modal_phone" class="form-control" value="{{ initial.office_phone }}" placeholder="例: 059-123-4567">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">FAX</label>
                        <input type="text" id="renewal_modal_fax" class="form-control" value="{{ initial.office_fax }}" placeholder="例: 059-123-4568">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-primary" id="renewalOfficeSaveBtn">
                    <i class="fas fa-save me-1"></i>保存して反映
                </button>
            </div>
        </div>
    </div>
</div>
