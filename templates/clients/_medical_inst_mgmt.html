<!-- 医療機関 編集モーダル（インライン） -->
<div class="modal fade" id="instEditModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered" style="max-width:700px; align-self:flex-start; margin-top:max(5vh, 3rem);">
        <div class="modal-content">
            <form id="instEditForm">
                <input type="hidden" id="instEdit_pk" value="">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-hospital me-2"></i>医療機関を編集</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="instEditError" class="alert alert-danger d-none"></div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">法人名</label>
                            <input type="text" id="instEdit_corp_name" name="corp_name" class="form-control" placeholder="例: 医療法人社団 〇〇会　社会医療法人 〇〇会">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">医療機関名 <span class="text-danger">*</span></label>
                            <input type="text" id="instEdit_hospital_name" name="hospital_name" class="form-control" placeholder="例: 津腎クリニック" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">フリガナ</label>
                            <input type="text" id="instEdit_furigana" name="hospital_furigana" class="form-control" placeholder="例: ツジンクリニック">
                        </div>
                        <div class="col-12">
                            <label class="form-label">医師氏名</label>
                            <div id="instEdit_doctors_container" class="row g-2"></div>
                            <button type="button" class="btn btn-outline-secondary btn-sm mt-1" onclick="addInstEditDoctorRow()">
                                <i class="fas fa-plus me-1"></i>医師を追加
                            </button>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">郵便番号</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">〒</span>
                                <input type="text" id="instEdit_postal_code" name="postal_code" class="form-control" placeholder="514-0000">
                            </div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">住所</label>
                            <input type="text" id="instEdit_address" name="address" class="form-control" placeholder="例: 津市○○町1-2-3">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">電話番号</label>
                            <input type="text" id="instEdit_phone" name="phone" class="form-control" placeholder="059-000-0000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">FAX番号</label>
                            <input type="text" id="instEdit_fax" name="fax" class="form-control" placeholder="059-000-0001">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
var _csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

function _addDoctorRow(value) {
    var c = document.getElementById('instEdit_doctors_container');
    var col = document.createElement('div');
    col.className = 'col-6';
    col.innerHTML = '<div class="d-flex align-items-center gap-1">'
        + '<input type="text" name="doctor_name" class="form-control" placeholder="例: 田中 一郎" value="' + (value || '') + '">'
        + '<button type="button" class="btn-close" style="font-size:0.7rem;" onclick="this.closest(\'.col-6\').remove()"></button>'
        + '</div>';
    c.appendChild(col);
}

window.openCurrentInstEdit = function(selectId) {
    var selId = selectId || 'doctor_type_select';
    window._instEditActiveSelect = selId;
    var sel = document.getElementById(selId);
    if (!sel) return;

    document.getElementById('instEditError').classList.add('d-none');
    var container = document.getElementById('instEdit_doctors_container');
    container.innerHTML = '';

    if (sel.value === 'other') {
        // 新規登録
        document.getElementById('instEdit_pk').value            = '';
        document.getElementById('instEdit_corp_name').value     = '';
        document.getElementById('instEdit_hospital_name').value = '';
        document.getElementById('instEdit_furigana').value      = '';
        document.getElementById('instEdit_phone').value         = '';
        document.getElementById('instEdit_fax').value           = '';
        document.getElementById('instEdit_postal_code').value   = '';
        document.getElementById('instEdit_address').value       = '';
        document.querySelector('#instEditModal .modal-title').innerHTML = '<i class="fas fa-hospital me-2"></i>医療機関を新規登録';
        _addDoctorRow();
    } else {
        // 編集
        var opt = sel.options[sel.selectedIndex];
        var pk  = opt.dataset.pk;
        if (!pk) return;
        document.getElementById('instEdit_pk').value            = pk;
        document.getElementById('instEdit_corp_name').value     = opt.dataset.corpName || '';
        document.getElementById('instEdit_hospital_name').value = opt.dataset.hospital || '';
        document.getElementById('instEdit_furigana').value      = opt.dataset.furigana || '';
        document.getElementById('instEdit_phone').value         = opt.dataset.phone    || '';
        document.getElementById('instEdit_fax').value           = opt.dataset.fax      || '';
        document.getElementById('instEdit_postal_code').value   = opt.dataset.postal   || '';
        document.getElementById('instEdit_address').value       = opt.dataset.address  || '';
        document.querySelector('#instEditModal .modal-title').innerHTML = '<i class="fas fa-hospital me-2"></i>医療機関を編集';
        var name = opt.dataset.name || '';
        if (name) _addDoctorRow(name); else _addDoctorRow();
    }

    bootstrap.Modal.getOrCreateInstance(document.getElementById('instEditModal')).show();
};

document.getElementById('instEditForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl = document.getElementById('instEditError');
    if (!document.getElementById('instEdit_hospital_name').value.trim()) {
        errEl.textContent = '医療機関名は必須です。';
        errEl.classList.remove('d-none');
        return;
    }
    errEl.classList.add('d-none');
    var pk  = document.getElementById('instEdit_pk').value;
    var url = pk ? '/clients/medical-institutions/' + pk + '/update/' : '/clients/medical-institutions/create/';
    fetch(url, {
        method: 'POST',
        headers: { 'X-CSRFToken': _csrf, 'X-Requested-With': 'XMLHttpRequest' },
        body: new FormData(this),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.success) {
            errEl.textContent = data.error || 'エラーが発生しました。';
            errEl.classList.remove('d-none');
            return;
        }
        // doctor_type_select の更新
        var _activeSelId = window._instEditActiveSelect || 'doctor_type_select';
        var sel = document.getElementById(_activeSelId);
        if (sel) {
            var existingOpt = Array.from(sel.options).find(function(o) { return o.dataset.pk === String(data.id); });
            if (existingOpt) {
                // 既存 option を更新
                existingOpt.dataset.corpName = data.corp_name      || '';
                existingOpt.dataset.hospital  = data.hospital_name;
                existingOpt.dataset.furigana  = data.hospital_furigana || '';
                existingOpt.dataset.name      = data.doctor_name       || '';
                existingOpt.dataset.doctors   = (data.doctors || []).join(',');
                existingOpt.dataset.phone     = data.phone             || '';
                existingOpt.dataset.fax       = data.fax               || '';
                existingOpt.dataset.postal    = data.postal_code       || '';
                existingOpt.dataset.address   = data.address           || '';
            } else {
                // 新規 option を追加してドロップダウンに選択
                var newOpt = document.createElement('option');
                newOpt.value              = sel.options.length;
                newOpt.dataset.pk         = data.id;
                newOpt.dataset.corpName   = data.corp_name      || '';
                newOpt.dataset.hospital   = data.hospital_name;
                newOpt.dataset.furigana   = data.hospital_furigana || '';
                newOpt.dataset.name       = data.doctor_name       || '';
                newOpt.dataset.doctors    = (data.doctors || []).join(',');
                newOpt.dataset.phone      = data.phone             || '';
                newOpt.dataset.fax        = data.fax               || '';
                newOpt.dataset.postal     = data.postal_code       || '';
                newOpt.dataset.address    = data.address           || '';
                newOpt.textContent        = '（新規）：' + data.hospital_name;
                // 「その他（新規登録）」の直前に挿入
                var otherOpt = Array.from(sel.options).find(function(o) { return o.value === 'other'; });
                if (otherOpt) { sel.insertBefore(newOpt, otherOpt); }
                else { sel.appendChild(newOpt); }
                sel.value = newOpt.value;
            }
            if (typeof toggleDoctorSelection === 'function') toggleDoctorSelection(false);
        }
        bootstrap.Modal.getInstance(document.getElementById('instEditModal')).hide();
    });
});
})();
</script>
